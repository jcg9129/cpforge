[workspace]
members = [".", "crates/cpf-fixture"]
resolver = "3"

[package]
license = "MIT OR Apache-2.0"
name = "cpforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
exclude = ["tests/fixtures/testlib/**"]
description = "A command-line workspace for competitive programming"

[[bin]]
name = "cpf"
path = "src/main.rs"

[dependencies]
jiff = { version = "=0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
getrandom = "0.3"
sha2 = "0.10.9"
toml_edit = "=0.22.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "time", "sync", "macros"] }
# Keep normalization and case folding on the same Unicode data release.
icu_normalizer = { version = "=2.0.0", default-features = false, features = ["compiled_data"] }
icu_casemap = "=2.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Time"] }

[features]
# Deterministic failure injection for storage integration tests; never enabled by default.
storage-test-hooks = []

[dev-dependencies]
cpf-fixture = { path = "crates/cpf-fixture" }

# Test helpers only: crash-dialog suppression and ordinal environment conformance.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_Globalization"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[lints]
workspace = true

[profile.release]
panic = "unwind"
