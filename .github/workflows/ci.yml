name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CPF_REQUIRE_TMPFS: ${{ matrix.os != 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install GCC 14 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gcc@14
          echo "$(brew --prefix gcc@14)/bin" >> "$GITHUB_PATH"
      - name: Install MinGW-w64 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW-w64 to PATH
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Verify required toolchains
        shell: bash
        run: |
          set -euo pipefail
          cpp=g++
          if [[ "$RUNNER_OS" == macOS ]]; then
            cpp=g++-14
          fi
          for tool in python java javac "$cpp"; do
            command -v "$tool"
          done
          python --version
          java -version
          javac -version
          "$cpp" --version
      - name: Keep testlib fixtures out of crate archives
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          files="$(cargo package --list --allow-dirty --locked)"
          # Guard against a vacuous pass on an empty or unexpected listing.
          grep -qx 'Cargo.toml' <<< "$files"
          grep -qx 'tests/job_engine_linux.rs' <<< "$files"
          if grep -E '^tests/fixtures/testlib/|(^|/)testlib\.h$' <<< "$files"; then
            echo 'testlib fixtures must not ship' >&2
            exit 1
          fi
      - run: cargo fmt --all --check
      - name: Forbid Tokio process ownership
        shell: bash
        run: |
          set -euo pipefail
          features="$(cargo tree --workspace --target all -e features -i tokio --locked)"
          if grep -F 'feature "process"' <<< "$features"; then
            echo 'Tokio process feature violates execution contract §3.1' >&2
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --no-fail-fast --locked
      - run: cargo test --workspace --all-targets --all-features --no-fail-fast --locked
      - name: Record the full session latency benchmark
        if: matrix.os != 'windows-latest'
        timeout-minutes: 5
        run: cargo test --locked --test session_linux fixture_17_tiny_exchange_latency_benchmark -- --ignored --exact
      # --all-targets excludes doctests, which hold the compile_fail API checks.
      - run: cargo test --workspace --doc --locked
      - name: Verify bind-mount storage boundaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Ask Cargo for the test executable: its location depends on the Cargo version.
          test_binary=$(cargo test --workspace --all-features --locked --test storage --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "storage" and .profile.test == true) | .executable')
          test -x "$test_binary"
          sudo "$test_binary" --exact linux_bind_mount_boundary --ignored --nocapture

  msrv:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CPF_REQUIRE_TMPFS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --no-fail-fast --locked
      - run: cargo test --workspace --doc --locked
