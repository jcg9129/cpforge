[package]
license = "MIT OR Apache-2.0"
name = "cpf-fixture"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.85"
description = "Test-only process scripts and watchdog harness for cpforge"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
